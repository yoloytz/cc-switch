name: Kimi validation
on:
  workflow_dispatch:
    inputs:
      ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  backend:
    runs-on: windows-latest
    env:
      CC_SWITCH_TEST_HOME: ${{ runner.temp }}/kimi-test-home
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Prepare and format
        shell: bash
        run: |
          mkdir -p dist
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --binary > format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: format-patch
          path: format.patch
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --tests -- --test-threads=1
      - uses: actions/upload-artifact@v4
        with:
          name: cc-switch-windows-tests
          path: src-tauri/target/debug/deps/cc_switch_lib-*.exe
      - name: Verify committed formatting
        run: git diff --exit-code
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format:check
